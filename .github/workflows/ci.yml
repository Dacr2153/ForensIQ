name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

      - name: MyPy type check
        run: mypy src/

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install system YARA library
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libyara-dev yara

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and dev dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      # Run the full test suite (unit + integration) in a single pass so that
      # coverage is measured across both test layers.  The fail_under threshold
      # in pyproject.toml [tool.coverage.report] is automatically enforced by
      # pytest-cov — CI fails if coverage drops below the floor.
      - name: Run full test suite with coverage
        run: |
          pytest tests/ -v --tb=short \
            --cov=src/forensiq \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -x

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      # Audit runtime dependencies for known CVEs.
      # requirements.txt is generated by pip-compile from pyproject.toml and
      # contains pinned versions for reproducible audits.
      # GHSA-3qx2-6f78-w2j8: known false-positive in volatility3 indirect dep,
      # tracked in issue #42 — remove once upstream releases a patch.
      # The || true has been intentionally removed: CI must fail on real CVEs.
      - name: Audit runtime dependencies for CVEs
        run: |
          pip-audit --requirement requirements.txt \
            --ignore-vuln GHSA-3qx2-6f78-w2j8
